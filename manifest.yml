applications:
  - name: kpi-agent
    memory: 256M
    disk_quota: 512M
    instances: 1
    buildpacks:
      - python_buildpack
    command: gunicorn app_btp:app --bind 0.0.0.0:$PORT --workers 2
    env:
      FLASK_ENV: production
      PYTHONUNBUFFERED: true
    services:
      - prompt-db
      - kpi-agent-aicore
      - kpi-agent-auth
